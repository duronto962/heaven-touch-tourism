<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heaven Touch Tourism Ltd. | Travel Packages</title><meta name="theme-color" content="#ffffff"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Bengali',sans-serif;background:#fff;color:#143d30}.intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff;z-index:3;transition:opacity .7s,visibility .7s;padding:20px}.intro.hide{opacity:0;visibility:hidden;pointer-events:none}.logo{width:min(80vw,450px);height:auto;object-fit:contain;animation:reveal 1.4s ease-out both,float 2.4s ease-in-out 1.4s infinite alternate;filter:drop-shadow(0 12px 18px #0002)}@keyframes reveal{from{opacity:0;transform:scale(.6) translateY(35px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes float{to{transform:translateY(-12px)}}.intro h1{font-size:clamp(19px,4vw,29px);margin:0;text-align:center}.intro p{margin:0;color:#527268;text-align:center}.loader{height:4px;width:min(250px,70vw);background:#e3eee9;border-radius:8px;overflow:hidden}.loader:after{content:"";display:block;height:100%;background:#087e48;animation:load 4s linear forwards}@keyframes load{from{width:0}to{width:100%}}button,.link{cursor:pointer;border:0;border-radius:10px;background:#087e48;color:#fff;padding:12px 19px;font-size:15px;text-decoration:none;display:inline-block}.skip{background:transparent;color:#087e48;text-decoration:underline;padding:5px}.page{min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#f5fbf8;border-bottom:1px solid #d7e8df}.brand{display:flex;align-items:center;gap:10px;font-weight:bold}.brand img{width:58px;height:48px;object-fit:contain}.actions{display:flex;gap:8px;flex-wrap:wrap}.viewer{flex:1;min-height:75vh;width:100%;border:0;background:#eee}.notice{text-align:center;padding:8px;font-size:13px;color:#547165}@media(max-width:600px){.viewer{min-height:calc(100dvh - 150px)}.top{align-items:flex-start}.actions a{padding:10px}}
</style></head><body><section class="intro" id="intro" aria-label="Welcome animation"><img class="logo" src="logo.jpg" alt="Heaven Touch Tourism Ltd. logo"><h1>Heaven Touch Tourism Ltd.</h1><p>ভ্রমণ শুধু বিনোদন নয়, তৈরি করি আজীবনের স্মৃতি</p><div class="loader" aria-hidden="true"></div><button class="skip" id="skip">এখনই PDF খুলুন</button></section><main class="page"><header class="top"><div class="brand"><img src="logo.jpg" alt="Heaven Touch logo"><span>Travel Package Brochure</span></div><div class="actions"><a class="link" href="packages.pdf" target="_blank" rel="noopener">নতুন ট্যাবে খুলুন</a><a class="link" href="packages.pdf" download="Heaven-Touch-Travel-Packages.pdf">PDF Download</a><button id="replay">লোগো আবার দেখুন</button></div></header><iframe class="viewer" title="Heaven Touch Travel Package PDF" data-src="packages.pdf#toolbar=1&navpanes=0" id="pdf"></iframe><div class="notice">PDF দেখা না গেলে “নতুন ট্যাবে খুলুন” বাটনে চাপুন।</div></main><script>
