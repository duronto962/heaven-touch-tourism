
<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heaven Touch Tourism Ltd. | Travel Packages</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f0f4f2;
 color:#153c30;
 font-family:Arial,sans-serif;
}
.intro{
 position:fixed;
 inset:0;
 z-index:10;
 background:white;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:16px;
 padding:20px;
 transition:opacity .6s,visibility .6s;
}
.intro.hide{
 opacity:0;
 visibility:hidden;
 pointer-events:none;
}
.hero{
 width:min(78vw,440px);
 animation:appear 1.4s ease-out both,
 hover 2.2s ease-in-out 1.4s infinite alternate;
}
@keyframes appear{
 from{opacity:0;transform:scale(.65) translateY(30px)}
 to{opacity:1;transform:scale(1)}
}
@keyframes hover{
 to{transform:translateY(-10px)}
}
.intro h1{
 text-align:center;
 font-size:clamp(20px,4vw,30px);
 margin:0;
}
.intro p{margin:0;text-align:center}
.progress{
 width:min(260px,75vw);
 height:4px;
 border-radius:10px;
 background:#ddd;
 overflow:hidden;
}
.progress:after{
 content:"";
 display:block;
 height:100%;
 background:#078248;
 animation:load 4s linear forwards;
}
@keyframes load{
 from{width:0}
 to{width:100%}
}
button,a.btn{
 border:0;
 border-radius:9px;
 padding:10px 14px;
 background:#087e48;
 color:white;
 text-decoration:none;
 cursor:pointer;
 font:inherit;
}
.skip{
 background:transparent;
 color:#087e48;
 text-decoration:underline;
}
header{
 background:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding:10px 16px;
 flex-wrap:wrap;
 position:sticky;
 top:0;
 z-index:2;
 box-shadow:0 1px 5px #0002;
}
.brand{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:bold;
}
.brand img{
 height:45px;
 width:60px;
 object-fit:contain;
}
.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}
#status{text-align:center;padding:15px}
.pages{
 max-width:900px;
 margin:0 auto;
 padding:10px;
}
.sheet{
 display:block;
 width:100%;
 height:auto;
 background:white;
 margin:10px auto 20px;
 box-shadow:0 3px 12px #0002;
}
</style>
</head>

<body>

<section id="intro" class="intro">
 <img class="hero" src="logo.jpg"
 alt="Heaven Touch Tourism Ltd.">
 <h1>Heaven Touch Tourism Ltd.</h1>
 <p>ভ্রমণ শুধু বিনোদন নয়, তৈরি করি আজীবনের স্মৃতি</p>
 <div class="progress"></div>
 <button id="skip" class="skip">
 এখনই ব্রোশিওর দেখুন
 </button>
</section>

<header>
 <div class="brand">
  <img src="logo.jpg" alt="">
  <span>Travel Package Brochure</span>
 </div>
 <div class="actions">
  <a class="btn" href="packages.pdf"
  target="_blank" rel="noopener">PDF আলাদা খুলুন</a>
  <a class="btn" href="packages.pdf" download>Download</a>
  <button id="replay">লোগো আবার দেখুন</button>
 </div>
</header>

<div id="status" role="status">
 ব্রোশিওর লোড হচ্ছে...
</div>
<main class="pages" id="pages"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const intro=document.getElementById('intro'),
status=document.getElementById('status'),
pages=document.getElementById('pages');

let timer,started=false;

async function showPDF(){
 intro.classList.add('hide');
 clearTimeout(timer);

 if(started)return;
 started=true;

 if(!window.pdfjsLib){
  status.textContent='PDF Viewer লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।';
  return;
 }

 pdfjsLib.GlobalWorkerOptions.workerSrc=
 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

 try{
  const doc=await pdfjsLib.getDocument('packages.pdf').promise;

  for(let n=1;n<=doc.numPages;n++){
   status.textContent=`পৃষ্ঠা ${n}/${doc.numPages} লোড হচ্ছে...`;

   const page=await doc.getPage(n);
   const base=page.getViewport({scale:1});
   const scale=Math.min(2,Math.max(1,
    (Math.min(window.innerWidth-20,900)/base.width)*
    Math.min(window.devicePixelRatio||1,2)
   ));
   const view=page.getViewport({scale});
   const canvas=document.createElement('canvas');

   canvas.className='sheet';
   canvas.width=Math.round(view.width);
   canvas.height=Math.round(view.height);
   canvas.setAttribute('aria-label',`PDF পৃষ্ঠা ${n}`);
   pages.appendChild(canvas);

   await page.render({
    canvasContext:canvas.getContext('2d'),
    viewport:view
   }).promise;
  }

  status.textContent=`মোট ${doc.numPages} পৃষ্ঠা — নিচে স্ক্রল করুন`;
 }catch(e){
  status.textContent='PDF দেখানো যায়নি। packages.pdf একই ফোল্ডারে আছে কি না দেখুন।';
  console.error(e);
 }
}

function start(){
 intro.classList.remove('hide');
 clearTimeout(timer);
 timer=setTimeout(showPDF,4000);
}

document.getElementById('skip').onclick=showPDF;
document.getElementById('replay').onclick=start;

start();
</script>
</body>
</html>
